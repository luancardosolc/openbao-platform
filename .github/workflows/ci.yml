---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: Install linting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          npm install -g markdownlint-cli@0.50.0
          python3 -m pip install pytest pre-commit
      - name: Lint
        run: make lint
      - name: Validate
        run: make validate
      - name: Test
        run: make test
